<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
<defs>
<linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#d4a574"/>
<stop offset="50%" stop-color="#c9a96e"/>
<stop offset="100%" stop-color="#b8860b"/>
</linearGradient>
</defs>
<!-- Outer petal ring - 12 petals -->
<g fill="url(#ag)" opacity="0.7" transform="translate(18,18)">
<path d="M0,-17 Q2,-14 0,-12 Q-2,-14 0,-17Z" transform="rotate(0)"/>
<path d="M0,-17 Q2,-14 0,-12 Q-2,-14 0,-17Z" transform="rotate(30)"/>
<path d="M0,-17 Q2,-14 0,-12 Q-2,-14 0,-17Z" transform="rotate(60)"/>
<path d="M0,-17 Q2,-14 0,-12 Q-2,-14 0,-17Z" transform="rotate(90)"/>
<path d="M0,-17 Q2,-14 0,-12 Q-2,-14 0,-17Z" transform="rotate(120)"/>
<path d="M0,-17 Q2,-14 0,-12 Q-2,-14 0,-17Z" transform="rotate(150)"/>
<path d="M0,-17 Q2,-14 0,-12 Q-2,-14 0,-17Z" transform="rotate(180)"/>
<path d="M0,-17 Q2,-14 0,-12 Q-2,-14 0,-17Z" transform="rotate(210)"/>
<path d="M0,-17 Q2,-14 0,-12 Q-2,-14 0,-17Z" transform="rotate(240)"/>
<path d="M0,-17 Q2,-14 0,-12 Q-2,-14 0,-17Z" transform="rotate(270)"/>
<path d="M0,-17 Q2,-14 0,-12 Q-2,-14 0,-17Z" transform="rotate(300)"/>
<path d="M0,-17 Q2,-14 0,-12 Q-2,-14 0,-17Z" transform="rotate(330)"/>
</g>
<!-- 8-point star tips -->
<g fill="#c9a96e" opacity="0.5" transform="translate(18,18)">
<path d="M0,-16 L1.5,-13.5 L-1.5,-13.5Z" transform="rotate(15)"/>
<path d="M0,-16 L1.5,-13.5 L-1.5,-13.5Z" transform="rotate(60)"/>
<path d="M0,-16 L1.5,-13.5 L-1.5,-13.5Z" transform="rotate(105)"/>
<path d="M0,-16 L1.5,-13.5 L-1.5,-13.5Z" transform="rotate(150)"/>
<path d="M0,-16 L1.5,-13.5 L-1.5,-13.5Z" transform="rotate(195)"/>
<path d="M0,-16 L1.5,-13.5 L-1.5,-13.5Z" transform="rotate(240)"/>
<path d="M0,-16 L1.5,-13.5 L-1.5,-13.5Z" transform="rotate(285)"/>
<path d="M0,-16 L1.5,-13.5 L-1.5,-13.5Z" transform="rotate(330)"/>
</g>
<!-- Main circle -->
<circle cx="18" cy="18" r="12" fill="none" stroke="url(#ag)" stroke-width="1.2"/>
<circle cx="18" cy="18" r="10.5" fill="none" stroke="#c9a96e" stroke-width="0.4" opacity="0.5"/>
<!-- Inner fill area for number -->
<circle cx="18" cy="18" r="10" fill="#c9a96e" fill-opacity="0.08"/>
</svg>