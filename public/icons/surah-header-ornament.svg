<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60">
<defs>
<linearGradient id="sg1" x1="0%" y1="50%" x2="100%" y2="50%">
<stop offset="0%" stop-color="#c9a96e" stop-opacity="0"/>
<stop offset="15%" stop-color="#c9a96e" stop-opacity="1"/>
<stop offset="85%" stop-color="#c9a96e" stop-opacity="1"/>
<stop offset="100%" stop-color="#c9a96e" stop-opacity="0"/>
</linearGradient>
<linearGradient id="sg2" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#b8860b" stop-opacity="0"/>
<stop offset="20%" stop-color="#c9a96e"/>
<stop offset="80%" stop-color="#c9a96e"/>
<stop offset="100%" stop-color="#b8860b" stop-opacity="0"/>
</linearGradient>
</defs>
<!-- Main frame -->
<rect x="30" y="8" width="340" height="44" rx="8" fill="none" stroke="url(#sg1)" stroke-width="1.5"/>
<rect x="34" y="12" width="332" height="36" rx="5" fill="none" stroke="url(#sg1)" stroke-width="0.5" opacity="0.6"/>
<!-- Left ornamental corner -->
<g transform="translate(30,30)" fill="#c9a96e">
<!-- Left arabesque -->
<path d="M0,-18 Q-8,-18 -14,-12 Q-18,-6 -18,0 Q-18,6 -14,12 Q-8,18 0,18" fill="none" stroke="#c9a96e" stroke-width="1.2"/>
<path d="M0,-14 Q-6,-14 -10,-9 Q-13,-4 -13,0 Q-13,4 -10,9 Q-6,14 0,14" fill="none" stroke="#c9a96e" stroke-width="0.6" opacity="0.6"/>
<!-- Left point floral -->
<path d="M-18,0 Q-24,-4 -28,0 Q-24,4 -18,0Z" fill="#c9a96e" opacity="0.8"/>
<circle cx="-28" cy="0" r="1.5" fill="#c9a96e"/>
<!-- Top/bottom flourishes -->
<path d="M4,-18 Q0,-24 -4,-18" fill="none" stroke="#c9a96e" stroke-width="0.8" opacity="0.7"/>
<path d="M4,18 Q0,24 -4,18" fill="none" stroke="#c9a96e" stroke-width="0.8" opacity="0.7"/>
</g>
<!-- Right ornamental corner -->
<g transform="translate(370,30)" fill="#c9a96e">
<path d="M0,-18 Q8,-18 14,-12 Q18,-6 18,0 Q18,6 14,12 Q8,18 0,18" fill="none" stroke="#c9a96e" stroke-width="1.2"/>
<path d="M0,-14 Q6,-14 10,-9 Q13,-4 13,0 Q13,4 10,9 Q6,14 0,14" fill="none" stroke="#c9a96e" stroke-width="0.6" opacity="0.6"/>
<path d="M18,0 Q24,-4 28,0 Q24,4 18,0Z" fill="#c9a96e" opacity="0.8"/>
<circle cx="28" cy="0" r="1.5" fill="#c9a96e"/>
<path d="M-4,-18 Q0,-24 4,-18" fill="none" stroke="#c9a96e" stroke-width="0.8" opacity="0.7"/>
<path d="M-4,18 Q0,24 4,18" fill="none" stroke="#c9a96e" stroke-width="0.8" opacity="0.7"/>
</g>
<!-- Center top ornament -->
<g transform="translate(200,8)" fill="#c9a96e">
<path d="M-6,0 Q-3,-6 0,-8 Q3,-6 6,0" fill="none" stroke="#c9a96e" stroke-width="0.8"/>
<circle cy="-9" r="1.5" fill="#c9a96e" opacity="0.8"/>
</g>
<!-- Center bottom ornament -->
<g transform="translate(200,52)" fill="#c9a96e">
<path d="M-6,0 Q-3,6 0,8 Q3,6 6,0" fill="none" stroke="#c9a96e" stroke-width="0.8"/>
<circle cy="9" r="1.5" fill="#c9a96e" opacity="0.8"/>
</g>
<!-- Horizontal decorative lines -->
<line x1="50" y1="18" x2="130" y2="18" stroke="url(#sg2)" stroke-width="0.4" opacity="0.5"/>
<line x1="50" y1="42" x2="130" y2="42" stroke="url(#sg2)" stroke-width="0.4" opacity="0.5"/>
<line x1="270" y1="18" x2="350" y2="18" stroke="url(#sg2)" stroke-width="0.4" opacity="0.5"/>
<line x1="270" y1="42" x2="350" y2="42" stroke="url(#sg2)" stroke-width="0.4" opacity="0.5"/>
<!-- Small 8-pointed stars as separators -->
<g fill="#c9a96e" opacity="0.6">
<g transform="translate(140,30)"><polygon points="0,-4 1,-1 4,0 1,1 0,4 -1,1 -4,0 -1,-1" /></g>
<g transform="translate(260,30)"><polygon points="0,-4 1,-1 4,0 1,1 0,4 -1,1 -4,0 -1,-1" /></g>
</g>
<!-- Corner star accents -->
<g fill="#c9a96e" opacity="0.5">
<g transform="translate(42,16)"><polygon points="0,-3 0.8,-0.8 3,0 0.8,0.8 0,3 -0.8,0.8 -3,0 -0.8,-0.8"/></g>
<g transform="translate(358,16)"><polygon points="0,-3 0.8,-0.8 3,0 0.8,0.8 0,3 -0.8,0.8 -3,0 -0.8,-0.8"/></g>
<g transform="translate(42,44)"><polygon points="0,-3 0.8,-0.8 3,0 0.8,0.8 0,3 -0.8,0.8 -3,0 -0.8,-0.8"/></g>
<g transform="translate(358,44)"><polygon points="0,-3 0.8,-0.8 3,0 0.8,0.8 0,3 -0.8,0.8 -3,0 -0.8,-0.8"/></g>
</g>
</svg>